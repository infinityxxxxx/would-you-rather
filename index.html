<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1220">
  <meta name="description" content="A quick Would You Rather party game for one shared phone. Works offline. No accounts, no ads.">
  <title>Would You Rather?</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#0f1220;--panel:#1b2036;--text:#f2f4ff;--dim:#9aa3c7;--accent:#ff4d6d;--ok:#4dd6a4;--line:#2c3354;--on:#fff;--enter:250ms;--exit:200ms;--out:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    button{font:inherit;color:var(--text);border:0;border-radius:14px;padding:14px;cursor:pointer;touch-action:manipulation;transition:transform 150ms var(--out),opacity .2s}
    button:active:not(:disabled){transform:scale(.97)}
    button:disabled{opacity:.35;cursor:default}
    input:not([type=checkbox]){width:100%;min-width:0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;-webkit-user-select:text;user-select:text}
    input[type=checkbox]{width:18px;height:18px;margin:0;flex:none;accent-color:var(--accent)}
    h1{margin:.2em 0 0;font-size:2rem;line-height:1.15}
    h2{margin:0;font-size:1rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
    .dim{color:var(--dim)}
    .ghost{background:var(--panel)}
    .big{width:100%;background:var(--accent);color:var(--on);font-weight:700;font-size:1.1rem;box-shadow:0 8px 24px -8px var(--accent)}
    .big:disabled{box-shadow:none}
    .link{background:none;color:var(--dim);font-size:.85rem;padding:6px 0 6px 12px}

    /* Home */
    .home{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100svh;display:flex;flex-direction:column;gap:12px}
    .home>*{animation:up var(--enter) var(--out) backwards;animation-delay:calc(var(--i,0)*30ms)}
    .tag{margin:0 0 8px}
    .head{display:flex;align-items:center;justify-content:space-between;min-height:36px}
    .cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .cats label{background:var(--panel);padding:10px;border-radius:10px;font-size:.9rem;display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer;transition:transform 150ms var(--out)}
    .cats label:active{transform:scale(.97)}
    .hint{margin:0;font-size:.85rem}
    .tog{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:14px;border-radius:12px;cursor:pointer}
    .hint.warn{color:var(--accent)}
    details{background:var(--panel);border-radius:12px;padding:14px}
    summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:24px}
    summary::-webkit-details-marker{display:none}
    summary:after{content:'+';color:var(--dim);font-size:1.3rem;line-height:1}
    details[open] summary:after{content:'−'}
    .form{display:grid;gap:8px;margin-top:12px}
    .form input{background:var(--bg)}
    .note{font-size:.85rem;color:var(--ok);min-height:1.2em;margin:0}
    .mine{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
    .mine:empty{display:none}
    .mine li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 6px 6px 12px;font-size:.9rem}
    .mine span{flex:1;min-width:0;overflow-wrap:anywhere}
    .mine button{background:none;color:var(--dim);padding:10px;font-size:.85rem}
    .foot{margin:auto 0 0;padding-top:4px;text-align:center;font-size:.8rem}

    /* Game */
    .game{position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
    .bar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
    .bar button{padding:0;height:48px;font-size:1.2rem}
    .bar .mid{text-align:center;min-width:0}
    .bar h2{font-size:.85rem}
    .bar .cat{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .split{flex:1;min-height:0;position:relative;display:grid;grid-template-rows:1fr 1fr;gap:12px;width:100%;max-width:560px;margin:0 auto;padding:0 16px}
    .opt{--c:var(--accent);position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:20px;border:2px solid var(--c);background:linear-gradient(160deg,#3f1622,#231019);box-shadow:0 0 22px -8px var(--c);font-size:clamp(1.25rem,5.6vw,1.75rem);font-weight:700;line-height:1.25;transition:transform 150ms var(--out),opacity 200ms ease-in-out}
    #optB{--c:var(--ok);background:linear-gradient(160deg,#103a30,#0a2320)}
    /* The result bar slides, so it uses ease-in-out; everything arriving on screen uses ease-out. */
    .fill{position:absolute;inset:0;background:var(--c);opacity:.24;transform-origin:left;transform:scaleX(0)}
    .voted .fill{transition:transform .3s ease-in-out}
    .stack{position:relative;z-index:1;max-width:100%}
    .text{display:block;overflow-wrap:anywhere}
    .stat{display:block;color:var(--c);font-size:clamp(2.4rem,11vw,3.4rem);font-weight:800;line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums;animation:up var(--enter) var(--out)}
    .pick{position:absolute;z-index:2;top:12px;left:12px;background:var(--c);color:var(--bg);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:800;animation:up var(--enter) var(--out)}
    .voted:not(.leave) .opt:not(.picked){opacity:.72}
    .picked{animation:pulse .5s ease-out}
    .or{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--bg);border:2px solid var(--line);color:var(--dim);font-size:.8rem;font-weight:800;pointer-events:none}
    .enter .opt{animation:up var(--enter) var(--out) backwards}
    .enter #optB{animation-delay:30ms}
    .leave .opt{opacity:0;transform:translateY(-8px);transition:transform var(--exit) ease-in,opacity var(--exit) ease-in}
    .info{padding:12px 16px max(14px,env(safe-area-inset-bottom));text-align:center;font-size:.9rem;min-height:46px}

    /* End of deck */
    .done{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
    .done>*{animation:up var(--enter) var(--out) backwards}
    .done>:nth-child(2){animation-delay:30ms}.done>:nth-child(3){animation-delay:60ms}.done>:nth-child(4){animation-delay:90ms}
    .done p{margin:0 0 8px;max-width:340px}
    .done button{width:min(100%,320px)}

    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes pulse{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 0 14px transparent}}
    @media(min-aspect-ratio:1/1){
      .split{max-width:900px;grid-template-rows:none;grid-template-columns:1fr 1fr}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="home" id="home">
  <h1>Would you rather?</h1>
  <p class="tag dim">Two options. One choice.</p>
  <div class="head"><h2 id="catsLabel">Categories</h2><button class="link" id="clearCats">Clear all</button></div>
  <div class="cats" id="cats" role="group" aria-labelledby="catsLabel"></div>
  <p class="hint dim" id="catHint" role="status"></p>
  <button class="big" id="play">Play</button>
  <label class="tog"><span>Click sound</span><input type="checkbox" id="sound"></label>
  <details id="customBox">
    <summary>Add your own questions</summary>
    <div class="form">
      <input id="customA" maxlength="90" placeholder="Option 1" aria-label="Option 1">
      <input id="customB" maxlength="90" placeholder="Option 2" aria-label="Option 2">
      <button class="big" id="saveCustom">Save</button>
      <p class="note" id="note" role="status"></p>
    </div>
    <ul class="mine" id="mine"></ul>
  </details>
  <p class="foot dim">Percentages are random, just for fun.</p>
</main>

<section class="game" id="game" hidden>
  <header class="bar">
    <button class="ghost" id="back" aria-label="Back to menu">←</button>
    <div class="mid"><h2>Would you rather?</h2><div class="cat" id="cat"></div></div>
  </header>
  <div class="split" id="split" aria-live="polite">
    <button class="opt" id="optA"><span class="fill"></span><span class="stack"><span class="stat" hidden></span><span class="text"></span></span></button>
    <button class="opt" id="optB"><span class="fill"></span><span class="stack"><span class="stat" hidden></span><span class="text"></span></span></button>
    <div class="or" aria-hidden="true">OR</div>
  </div>
  <div class="info dim" id="info" role="status"></div>
</section>

<section class="done" id="done" hidden>
  <h1>That's all of them!</h1>
  <p class="dim">You've seen every question in these categories.</p>
  <button class="big" id="again">Shuffle and play again</button>
  <button class="ghost" id="toMenu">Back to menu</button>
</section>

<script src="questions.js"></script>
<script src="logic.js"></script>
<script>
const $ = id => document.getElementById(id);
// A vote can't advance the game until this has passed, so a double tap isn't read as "next".
const TAP_GUARD_MS = 400;
// Matches --exit in the CSS.
const LEAVE_MS = matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 200;

const load = (key, fallback) => { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; } };
const save = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };

// Text-based ids keep "already seen" attached to a question if the list is reordered.
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 ^ s.charCodeAt(i)) >>> 0; return h.toString(36); }
const builtIn = BUILT_IN_QUESTIONS.map(([cat, heat, a, b]) => ({id: 'q' + hash(a + '|' + b), cat, heat, a, b}));

const settings = Object.assign({sound: true}, load('wyrSettings', {}));
// Remembering what's unticked means categories added later start ticked. Older saves carry the spice picker's choices.
if (!settings.offCats) settings.offCats = OFF_BY_DEFAULT.filter(c => !(c === 'Spicy' && settings.spice === 'spicy') && !(c === 'Adult' && settings.adult));
delete settings.spice; delete settings.adult;
try { localStorage.removeItem('wyrVotes'); } catch {}
let seen = load('wyrSeen', []), custom = load('wyrCustom', []);
let deck = [], pos = 0, current = null, votedAt = 0, leaving = false;

const allQuestions = () => [...builtIn, ...custom.map(q => ({...q, cat: CUSTOM_CATEGORY}))];
const pool = () => questionsIn(allQuestions(), settings.offCats);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Unseen questions come first, so reopening the game doesn't repeat the same ones. */
function buildDeck() {
  const all = pool(), seenSet = new Set(seen);
  deck = [...shuffle(all.filter(q => !seenSet.has(q.id))), ...shuffle(all.filter(q => seenSet.has(q.id)))];
  pos = 0;
}

function renderCats() {
  const box = $('cats'), firstRender = !box.children.length;
  box.replaceChildren(...categoriesOf(allQuestions()).map((c, i) => {
    const label = document.createElement('label'), input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !settings.offCats.includes(c);
    input.onchange = () => {
      settings.offCats = input.checked ? settings.offCats.filter(x => x !== c) : [...settings.offCats, c];
      save('wyrSettings', settings); renderSelection();
    };
    label.append(input, c);
    if (firstRender) { label.style.animation = `up var(--enter) var(--out) ${i * 30}ms backwards`; }
    return label;
  }));
}
function renderSelection() {
  const empty = !pool().length;
  $('play').disabled = empty;
  $('clearCats').disabled = empty;
  $('catHint').className = 'hint ' + (empty ? 'warn' : 'dim');
  $('catHint').textContent = empty ? 'Pick at least one category.' : 'Pick as many as you like. Spicy and Adult stay off until you tick them.';
}
function renderHome() {
  renderCats(); renderSelection();
  $('sound').checked = settings.sound;
  const list = $('mine'); list.replaceChildren();
  custom.forEach(q => {
    const li = document.createElement('li'), s = document.createElement('span'), del = document.createElement('button');
    s.textContent = `${q.a} or ${q.b}`;
    del.textContent = 'Delete';
    del.setAttribute('aria-label', `Delete ${q.a} or ${q.b}`);
    del.onclick = () => { custom = custom.filter(x => x.id !== q.id); save('wyrCustom', custom); renderHome(); };
    li.append(s, del); list.append(li);
  });
}

function setStat(btn, pct) {
  const el = btn.querySelector('.stat');
  el.hidden = pct === null; el.textContent = pct === null ? '' : pct + '%';
  btn.querySelector('.fill').style.transform = `scaleX(${pct === null ? 0 : pct / 100})`;
}

function showQuestion() {
  current = deck[pos]; votedAt = 0;
  const split = $('split');
  split.classList.remove('voted', 'leave', 'enter');
  void split.offsetWidth; // restarts the entrance animation
  split.classList.add('enter');
  for (const [btn, text] of [[$('optA'), current.a], [$('optB'), current.b]]) {
    btn.querySelector('.text').textContent = text;
    setStat(btn, null);
    btn.classList.remove('picked');
    btn.querySelector('.pick')?.remove();
  }
  $('cat').textContent = current.cat;
  $('info').textContent = 'Tap the one you\'d pick';
}

function vote(side) {
  const split = splitFor(current.id);
  if (!seen.includes(current.id)) { seen.push(current.id); save('wyrSeen', seen); }
  votedAt = performance.now();
  click();
  $('split').classList.remove('enter');
  $('split').classList.add('voted');
  setStat($('optA'), split.a); setStat($('optB'), split.b);
  const mine = side === 'a' ? $('optA') : $('optB'), tag = document.createElement('span');
  mine.classList.add('picked');
  tag.className = 'pick'; tag.textContent = '✓ Your pick'; mine.append(tag);
  $('info').textContent = 'Tap for the next one';
}

function tap(side) {
  if (leaving) return;
  if (!votedAt) return vote(side);
  if (performance.now() - votedAt < TAP_GUARD_MS) return;
  leaving = true;
  $('split').classList.add('leave');
  setTimeout(() => { leaving = false; if (!$('game').hidden) next(); }, LEAVE_MS);
}
function next() {
  pos++;
  if (pos >= deck.length) return finish();
  showQuestion();
}
function finish() {
  // Only this deck starts over, so other categories keep their unseen questions.
  const finished = new Set(deck.map(q => q.id));
  seen = seen.filter(id => !finished.has(id)); save('wyrSeen', seen);
  $('done').hidden = false;
}

function startGame(push = true) {
  buildDeck();
  if (!deck.length) return;
  $('done').hidden = true; $('home').hidden = true; $('game').hidden = false;
  if (push) history.pushState({game: true}, '');
  showQuestion();
}
function showHome() { $('game').hidden = true; $('done').hidden = true; $('home').hidden = false; renderHome(); }

let audio;
function click() {
  if (!settings.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.frequency.setValueAtTime(720, t); o.frequency.exponentialRampToValueAtTime(320, t + .05);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .07);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .08);
  } catch {}
}

$('clearCats').onclick = () => { settings.offCats = categoriesOf(allQuestions()); save('wyrSettings', settings); renderHome(); };
$('sound').onchange = e => { settings.sound = e.target.checked; save('wyrSettings', settings); };
$('play').onclick = () => startGame();
$('again').onclick = () => startGame(false);
$('toMenu').onclick = () => history.back();
$('back').onclick = () => history.back();
window.addEventListener('popstate', showHome);
$('optA').onclick = () => tap('a');
$('optB').onclick = () => tap('b');
$('saveCustom').onclick = () => {
  const a = $('customA').value.trim(), b = $('customB').value.trim();
  if (!a || !b) { $('note').textContent = 'Fill in both options first.'; return; }
  custom.push({id: 'c' + Date.now(), a, b});
  save('wyrCustom', custom);
  // A question you just wrote should turn up in the next game.
  settings.offCats = settings.offCats.filter(c => c !== CUSTOM_CATEGORY); save('wyrSettings', settings);
  $('customA').value = $('customB').value = '';
  $('note').textContent = 'Saved on this phone.';
  renderHome();
};
save('wyrSettings', settings);
renderHome();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
